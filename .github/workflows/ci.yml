name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  minion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile minion.py
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done
