name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  minion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The minion runs on the distro's own Python: 3.10 is the oldest it supports (install.sh checks).
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile minion.py
      - name: Tests
        run: python -m pytest -q
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done


  # ─────────────────────────────────────────────
  # Python lint and format (ruff.toml). The same job in every Ghostwire repo with Python.
  # ─────────────────────────────────────────────
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .
  # ─────────────────────────────────────────────
  # Release: when VERSION changes on main and everything above passes, tag v<VERSION> and
  # publish a GitHub release with notes. The same job in every Ghostwire app.
  # ─────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [minion, python-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Release if VERSION changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet HEAD~1 -- VERSION; then echo "VERSION unchanged"; exit 0; fi
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" > /dev/null 2>&1; then echo "$TAG is already released"; exit 0; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Ghostwire Minion $TAG" --generate-notes
